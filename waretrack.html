<title>WareTrack</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed isometric yard map; floating white cards pinned to the four corners */
:root{
  --bg:#e6e9f8; --card:#ffffff; --card-2:#f6f7fb; --ink:#141a2e; --ink-2:#4f5670; --ink-3:#8b92a8; --line:#eceef5;
  --blue:#2f5bea; --blue-soft:#eaefff; --navy:#1d2a6b;
  --green:#1f9d55; --green-soft:#e5f6ec; --amber:#e07b06; --amber-soft:#fdf0de; --gray-soft:#f0f1f6; --red:#ef4444;
  --font:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --shadow:0 6px 24px rgba(36,48,110,.09), 0 1px 2px rgba(36,48,110,.06);
  color-scheme: light;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:12px;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#scene.dragging{cursor:grabbing}
#scene.hover{cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:absolute;left:0;right:0;top:0;height:56px;padding:0 22px 0 42px;padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.96);border-bottom:1px solid rgba(225,229,242,.9);z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.2px;flex:0 0 auto;width:178px}
.brand svg{width:26px;height:26px}
.search{position:relative;flex:0 1 352px;min-width:0;height:34px;display:flex;align-items:center;gap:9px;padding:0 8px 0 12px;border:1px solid #e3e6f0;border-radius:9px;background:#fff;color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:12px;color:var(--ink);background:transparent}
.search input::placeholder{color:#6f7690}
.search kbd{font:inherit;font-size:10px;color:var(--ink-3);border:1px solid #e3e6f0;border-radius:4px;padding:1px 5px}
.spacer{flex:1}
.sitesel{position:relative;display:flex;align-items:center;height:36px;border:1px solid #e3e6f0;border-radius:9px;background:#fff}
.sitesel .main{display:flex;align-items:center;gap:8px;padding:0 10px 0 4px;height:100%;width:200px;text-align:left}
.badge{display:inline-grid;place-items:center;min-width:34px;height:26px;padding:0 5px;border-radius:6px;background:var(--blue);color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.2px}
.badge.all{background:#3a4057}
.sitesel .t{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.2}
.sitesel .t b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitesel .t small{font-size:9.5px;color:var(--ink-3);white-space:nowrap}
.sitesel .chev{color:var(--ink-3);display:grid;place-items:center}
.sitesel .drop{width:28px;height:100%;border-left:1px solid #eceef5;display:grid;place-items:center;color:var(--ink-2)}
.live{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;background:var(--green-soft);color:#167a42;font-weight:600;font-size:11.5px}
.live i{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18);animation:pulse 2s infinite}
.live .num{color:var(--ink);font-weight:500}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(34,197,94,.05)}}
.bellbtn{position:relative;width:32px;height:32px;display:grid;place-items:center;color:var(--ink-2);border-radius:8px}
.bellbtn:hover{background:var(--gray-soft)}
.bellbtn .dot{position:absolute;top:5px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid #fff}
.user{display:flex;align-items:center;gap:10px;padding-left:8px}
.user .who{display:flex;flex-direction:column;line-height:1.25}
.user .who b{font-size:12.5px;font-weight:600}
.user .who small{font-size:10.5px;color:var(--ink-2)}
.avatar{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:0 0 auto}

.pop{position:absolute;top:calc(100% + 6px);background:#fff;border:1px solid #e6e9f2;border-radius:10px;box-shadow:var(--shadow);z-index:40;padding:6px}
#sitePop{left:0;width:244px}
.siterow{display:flex;align-items:center;gap:9px;width:100%;padding:7px 6px;border-radius:7px;text-align:left}
.siterow:hover,.siterow.on{background:var(--card-2)}
.siterow .badge{height:28px}
.siterow .meta{flex:1;min-width:0}
.siterow .l1{display:flex;justify-content:space-between;font-weight:600;font-size:11.5px}
.siterow .l1 span{font-weight:500;color:var(--ink-2)}
.siterow .l2{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:9.5px;color:var(--ink-3)}
.siterow .l2 .bar{flex:0 0 60px}
.siterow .l2 span{margin-left:auto}
#searchPop{left:0;right:0;max-height:320px;overflow:auto}
#bellPop{right:0;width:280px}
.resrow{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:7px;text-align:left}
.resrow:hover,.resrow.on{background:var(--card-2)}
.resrow b{font-weight:600}
.resrow small{color:var(--ink-3);margin-left:auto;white-space:nowrap}
.poptitle{font-size:10px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px;padding:6px 8px 4px}
.alert{display:flex;gap:9px;padding:8px;border-radius:7px;align-items:flex-start}
.alert:hover{background:var(--card-2)}
.alert i{flex:0 0 8px;height:8px;border-radius:50%;margin-top:4px}
.alert div{line-height:1.4}
.alert small{display:block;color:var(--ink-3)}

/* cards */
.card{position:absolute;background:var(--card);border-radius:10px;box-shadow:var(--shadow);border:1px solid rgba(228,231,242,.9);z-index:10}
.kpis{position:absolute;top:68px;left:27px;display:flex;gap:10px;z-index:10}
.kpi{width:183px;height:62px;display:flex;align-items:center;gap:10px;padding:0 12px 0 11px;background:#fff;border-radius:10px;box-shadow:var(--shadow);border:1px solid rgba(228,231,242,.9)}
.kpi .ic{width:30px;height:30px;display:grid;place-items:center;flex:0 0 auto}
.kpi .lab{font-size:10.5px;font-weight:500;color:var(--ink)}
.kpi .val{display:flex;align-items:baseline;gap:7px;margin-top:1px}
.kpi .val b{font-size:17px;font-weight:600;letter-spacing:-.3px}
.kpi .val .up{font-size:10px;color:var(--green);font-weight:500}
.kpi .sub{font-size:9px;color:var(--ink-3);margin-top:1px}

.mapctl{position:absolute;top:72px;right:327px;width:30px;padding:3px 0;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border-radius:8px;box-shadow:var(--shadow);z-index:10}
.mapctl button{width:26px;height:24px;display:grid;place-items:center;color:var(--ink-2);border-radius:6px}
.mapctl button:hover{background:var(--card-2);color:var(--ink)}
.mapctl button.on{background:var(--blue-soft);color:var(--blue);box-shadow:inset 0 0 0 1px #c9d5ff}
.mapctl hr{width:18px;border:0;border-top:1px solid var(--line);margin:3px 0}

#inspector{top:68px;right:23px;width:292px;padding:12px 13px 12px 14px;max-height:calc(100% - 300px);overflow:auto}
.ih{display:flex;gap:10px;align-items:flex-start}
.ih .pic{width:36px;height:36px;flex:0 0 auto;display:grid;place-items:center}
.ih .eyebrow{font-size:8.5px;font-weight:700;color:var(--blue);letter-spacing:.6px;text-transform:uppercase}
.ih h2{margin:1px 0 0;font-size:14px;font-weight:700;letter-spacing:-.2px}
.ih .subt{font-size:10px;color:var(--ink-2);margin-top:1px}
.ih .acts{margin-left:auto;display:flex;gap:2px}
.ih .acts button{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;color:var(--ink-2)}
.ih .acts button:hover{background:var(--card-2)}
.ih .acts button.primary{background:var(--blue);color:#fff}
.ih .ident{min-width:0}
.statusline{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:10.5px;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:5px;font-size:10.5px;font-weight:500;white-space:nowrap}
.chip.g{background:var(--green-soft);color:var(--green)}
.chip.a{background:var(--amber-soft);color:var(--amber)}
.chip.b{background:var(--blue-soft);color:var(--blue)}
.chip.n{background:var(--gray-soft);color:var(--ink-3)}
.chip.lg{height:22px;padding:0 9px}
.progress{margin-top:9px}
.progress .bar{height:5px}
.progress .cap{display:flex;justify-content:flex-end;font-size:9.5px;color:var(--ink-3);margin-top:3px}
.bar{position:relative;height:4px;border-radius:3px;background:#edf0f6;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--green);transition:width .6s}
.bar.blue i{background:var(--blue)}
.bar.amber i{background:#f0a23a}
.rows{margin-top:8px}
.row{display:flex;justify-content:space-between;gap:12px;padding:5.5px 0;font-size:10.5px}
.row span{color:var(--ink-2)}
.row b{font-weight:500;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row a,.lnk{color:var(--blue);text-decoration:none;cursor:pointer;font-weight:500}
.row a:hover,.lnk:hover{text-decoration:underline}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.stat{background:var(--card-2);border-radius:7px;padding:6px 8px 7px}
.stat small{display:block;font-size:9px;color:var(--ink-2)}
.stat b{font-size:13px;font-weight:600}
.stat em{font-style:normal;font-size:9.5px;color:var(--ink-2);margin-left:2px}
.stat .bar{margin-top:4px;height:3px}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-size:10.5px;font-weight:600}
.sech span{font-size:9.5px;font-weight:400;color:var(--ink-3)}
.inv{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:10.5px}
.inv .ii{width:22px;height:22px;display:grid;place-items:center}
.inv .nm{flex:1}
.inv b{font-weight:600;width:44px;text-align:right}
.inv .chip{width:62px;justify-content:center;height:21px}
.fleetrow{display:flex;align-items:center;gap:10px;font-size:10px;margin-top:4px}
.fleetrow b{font-weight:600}
.fleetrow .bar{width:30px}

#tracking{left:27px;bottom:22px;width:746px;height:104px;padding:10px 14px;display:flex;gap:16px}
#tracking .tl{flex:1;min-width:0;display:flex;flex-direction:column}
.trhead{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12px}
.trhead .r{margin-left:auto;font-weight:400;font-size:9.5px;color:var(--ink-2)}
.steps{position:relative;display:flex;justify-content:space-between;margin-top:9px;padding:0 4px}
.step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:80px;text-align:center}
.step .dotc{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;box-shadow:0 0 0 3px #fff}
.step.todo .dotc{background:#eceef4;color:#a6abbd}
.step.active .dotc{box-shadow:0 0 0 3px #fff,0 0 0 6px #d9e2ff}
.step b{display:block;margin-top:6px;font-size:10px;font-weight:500;white-space:nowrap}
.step small{font-size:8.5px;color:var(--ink-3)}
.track{position:absolute;left:44px;right:44px;top:10px;height:2px;background:#e9ecf3;z-index:0}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);transition:width .6s}
.shipcard{flex:0 0 236px;align-self:center;height:84px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:9px;background:var(--card-2);text-align:left}
.shipcard:hover{background:#eff1f8}
.shipcard .tx{min-width:0;flex:1;line-height:1.35}
.shipcard .tx b{font-size:11.5px;font-weight:600}
.shipcard .tx div{font-size:10px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shipcard .chip{height:17px;font-size:9.5px;margin:2px 0}

#fleet{right:23px;bottom:22px;width:373px;padding:8px 10px 6px 12px}
.tabs{display:flex;align-items:center;gap:4px;height:26px}
.tabs .ic{width:22px;color:var(--blue);display:grid;place-items:center}
.tab{height:24px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:500;color:var(--ink-2)}
.tab em{font-style:normal;color:var(--ink-3);margin-left:3px;font-size:10px}
.tab.on{background:var(--card-2);color:var(--ink);box-shadow:inset 0 0 0 1px #e6e9f2}
.tabs .site{margin-left:auto;font-size:10px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flist{margin-top:4px;max-height:118px;overflow:auto}
.frow{display:grid;grid-template-columns:52px 1fr 66px 48px 12px;align-items:center;gap:6px;width:100%;padding:4px 2px;border-radius:6px;text-align:left;font-size:10.5px}
.frow:hover,.frow.on{background:var(--card-2)}
.frow .id b{display:block;font-size:10.5px;font-weight:600;line-height:1.15}
.frow .id small{font-size:8px;color:var(--ink-3)}
.frow .what{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.frow .what.muted{color:var(--ink-2)}
.frow .what i{flex:0 0 6px;height:6px;border-radius:50%}
.frow .chip{justify-content:center;height:19px;font-size:10px}
.frow .pr{font-size:9.5px;color:var(--ink-2);line-height:1.2}
.frow .pr .bar{width:28px;height:3px;margin-bottom:3px}
.frow svg{color:var(--ink-3)}

/* in-scene labels */
#labels{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:5px;height:19px;padding:0 7px;border-radius:5px;background:var(--blue);color:#fff;font-size:10px;font-weight:600;white-space:nowrap;box-shadow:0 3px 10px rgba(47,91,234,.35)}
.tag span{font-weight:400;opacity:.8;font-size:9px}
.tag.ghost{background:rgba(255,255,255,.92);color:var(--ink);box-shadow:var(--shadow)}
.tag.ghost span{color:var(--ink-3);opacity:1}
.sitetag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:9px;background:#fff;box-shadow:var(--shadow);pointer-events:auto;cursor:pointer;white-space:nowrap}
.sitetag b{font-size:11.5px;font-weight:600;display:block}
.sitetag small{font-size:9.5px;color:var(--ink-3)}
.sitetag .badge{height:26px}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);padding:6px 12px;border-radius:8px;background:rgba(20,26,46,.86);color:#fff;font-size:11px;z-index:30;pointer-events:none;transition:opacity .4s}

@media (max-width:1100px){
  .kpi{width:160px}
  .user .who{display:none}
  #tracking{width:calc(100% - 27px - 23px - 373px - 14px)}
  .shipcard{display:none}
}
@media (max-width:820px){
  .topbar{padding:0 12px;gap:10px}
  .brand{width:auto}
  .brand span{display:none}
  .search{flex:1}
  .search kbd{display:none}
  .sitesel .main{width:150px}
  .live,.user .ch{display:none}
  .kpis{left:12px;right:12px;top:64px;overflow-x:auto;scrollbar-width:none}
  .kpi{flex:0 0 150px;height:56px}
  #inspector{top:auto;bottom:182px;left:12px;right:12px;width:auto;max-height:34%}
  .mapctl{top:132px;right:12px}
  #tracking{display:none}
  #fleet{left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom,0px));width:auto}
}
@media (max-width:520px){
  .search{display:none}
  .spacer{display:none}
  .sitesel{flex:1;min-width:0}
  .sitesel .main{width:auto;flex:1;min-width:0}
  .user{padding-left:0}
}
@media (prefers-reduced-motion:reduce){.live i{animation:none}.bar i,.track i{transition:none}}
</style>

<div id="app">
  <canvas id="scene" aria-label="3D map of WareTrack warehouse sites"></canvas>
  <div id="labels"></div>

  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5 28 9.3v13.4L16 29.5 4 22.7V9.3z" fill="#2f5bea"/><path d="M16 2.5 28 9.3 16 16 4 9.3z" fill="#5d82ff"/><path d="M16 16v13.5L4 22.7V9.3z" fill="#2449c9"/><path d="M10 6 22 12.7v4.2" stroke="#fff" stroke-opacity=".5" stroke-width="1.6" fill="none"/></svg>
      <span>WareTrack</span>
    </div>
    <label class="search" for="searchInput">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" autocomplete="off" placeholder="Search sites, trucks, forklifts, pallets, shipments...">
      <kbd>/</kbd>
      <div id="searchPop" class="pop" hidden></div>
    </label>
    <div class="spacer"></div>
    <div class="sitesel" id="siteSel">
      <button class="main" id="siteMain" aria-haspopup="true">
        <span class="badge" id="siteBadge">WH-01</span>
        <span class="t"><b id="siteName">Riverside Hub</b><small id="siteSub" class="num">78% full · 1/2 docked</small></span>
        <span class="chev"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></span>
      </button>
      <button class="drop" id="siteDrop" aria-label="Choose site"><svg id="dropChev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
      <div id="sitePop" class="pop" hidden></div>
    </div>
    <div class="live"><i></i>Live <span class="num" id="clock">09:40</span></div>
    <div style="position:relative">
      <button class="bellbtn" id="bell" aria-label="Notifications"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><i class="dot"></i></button>
      <div id="bellPop" class="pop" hidden></div>
    </div>
    <div class="user">
      <div class="avatar"><svg viewBox="0 0 40 40"><rect width="40" height="40" fill="#cfd6f1"/><path d="M6 40c1-8 7-11 14-11s13 3 14 11z" fill="#2b3557"/><path d="M16 27h8v4a4 4 0 0 1-8 0z" fill="#7a4a2e"/><ellipse cx="20" cy="18" rx="7.4" ry="8.6" fill="#8a5636"/><path d="M12.4 17c-.6-7 3-10.5 7.6-10.5S28.2 10 27.6 17c-1-3-2.6-4.4-4-4.6-2 1.3-5.8 1.4-8.4.4-1.4.8-2.4 2.4-2.8 4.2z" fill="#231711"/><path d="M12.8 19.5c.4 5.8 3.4 9 7.2 9s6.8-3.2 7.2-9c-1 2.4-2 3.4-3 3.6-1.2-1-2.6-1.2-4.2-1.2s-3 .2-4.2 1.2c-1-.2-2-1.2-3-3.6z" fill="#231711"/><path d="M17.6 24.2c1.6.8 3.2.8 4.8 0" stroke="#5b3320" stroke-width=".9" fill="none"/></svg></div>
      <div class="who"><b>Alex Chen</b><small>Operations Manager</small></div>
      <svg class="ch" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#4f5670" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </div>
  </header>

  <section class="kpis" id="kpis" aria-label="Site metrics"></section>

  <nav class="mapctl" aria-label="Map controls">
    <button id="zoomIn" aria-label="Zoom in" title="Zoom in"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>

const fencePosts = [], fencePanels = [];
function addFence(x1, z1, x2, z2, gapFrom, gapTo) {
  const len = Math.hypot(x2 - x1, z2 - z1), n = Math.max(1, Math.round(len / 4));
  const ang = Math.atan2(z2 - z1, x2 - x1);
  for (let i = 0; i < n; i++) {
    const t0 = i / n, t1 = (i + 1) / n, tm = (t0 + t1) / 2;
    const d = tm * len;
    if (gapFrom != null && d > gapFrom && d < gapTo) continue;
    fencePanels.push([lerp(x1, x2, tm), lerp(z1, z2, tm), len / n, ang]);
    fencePosts.push([lerp(x1, x2, t0), lerp(z1, z2, t0)]);
  }
  fencePosts.push([x2, z2]);
}

function buildWarehouse(site) {

    const r2 = 3.4, a2 = Math.atan2(r2, d2 / 2), L2 = Math.hypot(r2, d2 / 2) + 0.8;
    for (const s of [1, -1]) { const sl = new THREE.Mesh(uvScale(new THREE.BoxGeometry(w2 + 1.2, 0.4, L2), w2 + 1.2, 0.4, L2, 2.2), roofM); sl.position.set(-w * 0.12, h2 + r2 / 2, -d / 2 - d2 / 2 + 2 + s * d2 / 4); sl.rotation.x = s * a2; sl.castShadow = true; g.add(sl); }

}

}
function paintLine(x1, z1, x2, z2, color = COL.orange, dash = 0) {
  const len = Math.hypot(x2 - x1, z2 - z1);
  if (!dash) { paintBoxes.push([(x1 + x2) / 2, (z1 + z2) / 2, Math.abs(x2 - x1) || 0.22, Math.abs(z2 - z1) || 0.22, color]); return; }
  const n = Math.floor(len / (dash * 2));
  for (let i = 0; i < n; i++) { const t = (i * 2 + 0.5) * dash / len; const x = lerp(x1, x2, t), z = lerp(z1, z2, t); paintBoxes.push([x, z, Math.abs(x2 - x1) ? dash : 0.22, Math.abs(z2 - z1) ? dash : 0.22, color]); }
}

class Mover {
  constructor(points, speed = 6, reverse = false, closed = false) {
    this.curve = new THREE.CatmullRomCurve3(points.map(p => p.isVector3 ? p.clone() : new THREE.Vector3(p[0], 0, p[1])), closed, 'centripetal', 0.5);
    this.curve.arcLengthDivisions = 500;
    this.len = this.curve.getLength(); this.s = 0; this.speed = speed; this.reverse = reverse; this.closed = closed; this.v = 0;
  }
  step(dt, limit = Infinity) {
    const end = Math.min(this.len, limit);
    const ramp = this.closed ? 1 : clamp(Math.min((this.s + 1.5) / 7, (end - this.s) / 9), 0.12, 1);
    this.v = this.speed * ramp;
    if (end - this.s < 0.02) { this.v = 0; return !this.closed && this.s >= this.len - 0.02; }
    this.s += this.v * dt;
    if (this.closed) this.s %= this.len; else this.s = Math.min(this.s, end);
    return !this.closed && this.s >= this.len - 0.02;
  }
  apply(obj, snap = false) {
    const u = clamp(this.s / this.len, 0, 1);
    const p = this.curve.getPointAt(u), t = this.curve.getTangentAt(u);
    obj.position.set(p.x, 0, p.z);
    let hd = Math.atan2(t.x, t.z) + (this.reverse ? Math.PI : 0);
    let dlt = hd - obj.rotation.y; dlt = Math.atan2(Math.sin(dlt), Math.cos(dlt));
    obj.rotation.y += dlt * (snap || Math.abs(dlt) > 1.2 ? 1 : 0.35);
  }
  get remaining() { return this.len - this.s; }
}

class Truck {
  constructor(site, cfg) {
    Object.assign(this, { done: 0, mode: 'unload', ...cfg });
    this.kind = 'truck'; this.site = site; this.size = [3.2, 5.0, 16.6];
    this.group = makeTruck(this.brand); world.add(this.group);
    this.dock = site.docks.find(d => d.name === this.bay) || null;
    if (this.dock) this.dock.reserved = this;
    this.forklift = null; this.wait = 0; this.today = 0;
    site.trucks.push(this); register(this);
    const st = this.state;
    if (st === 'docked') { this.parkAtDock(); }
    else if (st === 'docking') { this.startDocking(cfg.progress || 0); }
    else if (st === 'enroute') {
      this.mover = new Mover(site.approachPath(), 9.5);
      this.mover.s = Math.max(0, this.mover.len - 45 * (cfg.eta || 3)); this.mover.apply(this.group, true);
    }
  }
  get pos() { return this.group.position; }
  parkAtDock() {
    const p = this.site.dockPos(this.dock);
    this.group.position.copy(p); this.group.rotation.y = 0; this.state = 'docked'; this.dock.truck = this; this.mover = null;
    if (this.site.gateOwner === this) this.site.gateOwner = null;
  }
  startDocking(progress = 0) {
    const s = this.site; s.gateOwner = this; this.state = 'docking';
    this.phase = 0; this.mover = new Mover(s.dockApproach(this.dock), 5.5);
    this.mover2 = new Mover(s.dockReverse(this.dock), 2.6, true);
    const total = this.mover.len + this.mover2.len; let d = total * progress;
    if (d > this.mover.len) { this.phase = 1; this.mover.s = this.mover.len; this.mover2.s = d - this.mover.len; this.mover2.apply(this.group, true); }
    else { this.mover.s = d; this.mover.apply(this.group, true); }
  }
  depart() {
    const s = this.site;
    this.state = 'departing'; this.dock.truck = null; this.dock.reserved = null; this.dock.today++;
    this.mover = new Mover(s.departPath(this.dock), 6.5);
    if (this.forklift) { this.forklift.release(); this.forklift = null; }
    s.scheduleSpawn();
  }
  get dockingLeft() { return this.state === 'docking' ? (this.phase === 0 ? this.mover.remaining + this.mover2.len : this.mover2.remaining) : 0; }
  get etaMin() {
    if (this.state === 'enroute') return Math.max(1, Math.round(this.mover.remaining / 9.5 * TIME_SCALE / 60 + 0.4));
    if (this.state === 'gate') return 2;
    if (this.state === 'docking') return 1;
    return 0;
  }
  get speedKmh() { return this.mover ? Math.round(this.mover.v * 3.6 * 0.6) : 0; }
  get statusKey() {
    return { enroute: 'En route', gate: 'At gate', docking: 'Docking', departing: 'Departing', docked: this.mode === 'load' ? 'Loading' : 'Unloading' }[this.state];
  }
  update(dt) {
    const s = this.site;
    if (this.state === 'enroute') {
      const ahead = s.trucks.filter(t => t !== this && t.state === 'enroute' && t.mover.s > this.mover.s).length;
      const busy = s.trucks.some(t => t !== this && (t.state === 'gate' || t.state === 'docking'));
      const limit = (busy || ahead) ? this.mover.len - 22 * ((busy ? 1 : 0) + ahead) : Infinity;
      const arrived = this.mover.step(dt, limit); this.mover.apply(this.group);
      if (arrived) { this.state = 'gate'; this.wait = 3 + rnd() * 2; }
    } else if (this.state === 'gate') {
      const free = !s.gateOwner || s.gateOwner === this;
      const dockFree = this.dock && (!this.dock.truck || this.dock.truck === this);
      if (free) s.gateOwner = this;
      if (free && dockFree) { this.wait -= dt; if (this.wait <= 0) this.startDocking(0); }
    } else if (this.state === 'docking') {
      if (this.phase === 0) { if (this.mover.step(dt)) { this.phase = 1; } this.mover.apply(this.group); }
      else { const fin = this.mover2.step(dt); this.mover2.apply(this.group); if (fin) { this.done = 0; this.parkAtDock(); } }
    } else if (this.state === 'docked') {
      if (this.done >= this.total) { this.wait += dt; if (this.wait > 2.5) this.depart(); }
    } else if (this.state === 'departing') {
      const fin = this.mover.step(dt); this.mover.apply(this.group);
      if (fin) this.remove();
    }
  }
  remove() {
    const s = this.site; s.trucks.splice(s.trucks.indexOf(this), 1); unregister(this);
    if (selected === this) select(s.entity, { fly: false });
  }
}

class Forklift {
  constructor(site, cfg) {
    Object.assign(this, cfg); this.truckId = cfg.truck; this.truck = null; this.kind = 'forklift'; this.site = site; this.size = [2.4, 4.0, 4.6];
    this.group = makeForklift(); world.add(this.group); register(this);
    this.queue = []; this.task = null; this.carrying = null; this.v = 0; this.liftT = 0; this.hold = 0;
    site.forklifts.push(this);
    if (this.state === 'charging') this.placeAt(site.chargerSpot(this.charger), Math.PI);
    else this.placeAt(site.parkSpot(this.spot || 0), Math.PI);
    if (this.state === 'charging') site.chargers[this.charger].fl = this;
  }
  get pos() { return this.group.position; }
  placeAt(p, rot = 0) { this.group.position.copy(p); this.group.rotation.y = rot; }
  goTo(points, cb) { this.queue = points.map(p => p.clone()); this.onArrive = cb; }
  assign(truck) {
    this.state = 'work'; this.truck = truck; truck.forklift = this;
    if (this.chargerIdx != null) { this.site.chargers[this.chargerIdx].fl = null; this.chargerIdx = null; }
    this.site.chargers.forEach(c => { if (c.fl === this) c.fl = null; });
    this.cycle(true);
  }
  cycle(first) {
    const t = this.truck; if (!t || t.state !== 'docked') return this.release();
    if (t.done >= t.total) return this.release();
    const s = this.site, dk = t.dock, f = s.f;
    const lane = W(s, dk.x + 4.6, f + 19), work = W(s, dk.x + 4.6, f + 4.2);
    const stageP = W(s, s.stage.x + (dk.i % 2) * 3.2 - 1.6, s.stage.z + 6);
    const stageLane = W(s, s.stage.x + (dk.i % 2) * 3.2 - 1.6, f + 19);
    const toStage = [lane, stageLane, stageP], toTruck = [stageLane, lane, work];
    const pre = first ? [] : [];
    if (t.mode === 'load') {
      this.goTo([...pre, ...toStage], () => this.pick(() => this.goTo(toTruck, () => this.drop(() => { t.done++; s.stock--; this.moves++; this.cycle(); }))));
    } else {
      this.goTo([...pre, lane, work], () => this.pick(() => this.goTo(toStage, () => this.drop(() => { t.done++; s.stock++; this.moves++; this.cycle(); }))));

/* ================================================================ auto tour (mirrors the walkthrough in the reference video) */
const tour = { on: false, i: 0, t: 0 };
const TOUR_ORDER = ['WH-01', 'WH-04', 'WH-02', 'WH-03', 'WH-05'];
function tourSteps() {
  const steps = [];
  for (const id of TOUR_ORDER) {
    const s = SITES.find(x => x.id === id);
    steps.push(() => s.entity);
    steps.push(() => s.forklifts.find(f => f.state === 'work'));
    steps.push(() => s.pallets[0]);
    steps.push(() => s.bays.find(b => b.dock.reserved && !b.dock.truck) || s.bays[1]);
    steps.push(() => s.trucks.find(t => t.state === 'docked'));
    steps.push(() => s.trucks.find(t => t.state === 'docking' || t.state === 'enroute'));
  }
  return steps;
}
let TOUR = null;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.opacity = 0, 2600); }
function startTour() { TOUR ||= tourSteps(); tour.on = true; tour.t = 99; $('tour').classList.add('on'); toast('Auto tour on · click the map to take over'); }
function stopTour() { if (!tour.on) return; tour.on = false; $('tour').classList.remove('on'); }
function tickTour(dt) {
  if (!tour.on) { idleT += dt; if (idleT > 45 && !document.hidden) startTour(); return; }
  tour.t += dt;
  if (tour.t < 5.2) return;
  tour.t = 0;
  for (let k = 0; k < TOUR.length; k++) {
    const ent = TOUR[tour.i % TOUR.length](); tour.i++;
    if (ent && entities.includes(ent)) { select(ent); break; }
  }
}
